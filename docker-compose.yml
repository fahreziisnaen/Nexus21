services:
  # ─────────────────────────────────────────
  # PHP-FPM Application
  # ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - vendor_data:/var/www/vendor
      - node_modules_data:/var/www/node_modules
      - public_build_data:/var/www/public/build
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nexus_network

  # ─────────────────────────────────────────
  # Nginx Web Server
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nexus_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - public_build_data:/var/www/public/build
    depends_on:
      - app
    networks:
      - nexus_network

  # ─────────────────────────────────────────
  # MySQL Database
  # ─────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: nexus_db
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - nexus_network

  # ─────────────────────────────────────────
  # WhatsApp Server (Node.js / Baileys)
  # ─────────────────────────────────────────
  whatsapp:
    image: node:20-alpine
    container_name: nexus_whatsapp
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm install --omit=dev && node whatsapp-server.js"
    env_file:
      - .env.docker
    networks:
      - nexus_network

  # ─────────────────────────────────────────
  # phpMyAdmin
  # ─────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: nexus_phpmyadmin
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nexus_network

networks:
  nexus_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  vendor_data:
    driver: local
  node_modules_data:
    driver: local
  public_build_data:
    driver: local
